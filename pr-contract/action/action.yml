name: Hexis PR contract
description: >
  Validates a pull request against the Hexis PR contract (tier, release note, deploy actions, cross-repo dependencies,
  evidence, operational evidence), labels it, accrues merged PRs into the draft "Next release", publishes the release
  notes, records fixVersions in Jira, and renders the cross-repository release window.
inputs:
  mode:
    description: check | accrue | publish | window
    required: false
    default: check
  token:
    description: GitHub token. check needs pull-requests:write and issues:write; accrue/publish need contents:write; window needs read on every production repository and issues:write on the window repository.
    required: true
  profile:
    description: Override the repository profile (backend, engines, mobile, web, infra, localization)
    required: false
    default: ""
  pr-number:
    description: Pull request number when not running on a pull_request event
    required: false
    default: ""
  jira-email:
    description: Atlassian account email for Jira writes (optional; with jira-token enables fixVersions and comments)
    required: false
    default: ""
  jira-token:
    description: Atlassian API token for Jira writes (optional)
    required: false
    default: ""
  window-repository:
    description: Repository that holds the "Release window" issue (window mode; defaults to the current repository)
    required: false
    default: ""
  template-url:
    description: Link shown in the sticky comment
    required: false
    default: "https://app.notion.com/p/4074f18a6ad58103b302eae61f872d92"
outputs:
  tier:
    description: The tier after escalation
    value: ${{ steps.run.outputs.tier }}
  contract:
    description: The extracted contract as JSON
    value: ${{ steps.run.outputs.contract }}
  tickets:
    description: Comma-separated HEX keys (publish mode)
    value: ${{ steps.run.outputs.tickets }}
  url:
    description: The release window issue URL (window mode)
    value: ${{ steps.run.outputs.url }}
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "24"
    - name: Run the PR contract
      id: run
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PR_CONTRACT_MODE: ${{ inputs.mode }}
        PR_CONTRACT_PROFILE: ${{ inputs.profile }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_CONTRACT_TEMPLATE_URL: ${{ inputs.template-url }}
        PR_CONTRACT_CONFIG: ${{ github.action_path }}/../config/profiles.json
        JIRA_EMAIL: ${{ inputs.jira-email }}
        JIRA_API_TOKEN: ${{ inputs.jira-token }}
        WINDOW_REPOSITORY: ${{ inputs.window-repository }}
      run: node "${{ github.action_path }}/run.cjs"
